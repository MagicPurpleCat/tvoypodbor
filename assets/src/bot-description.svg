<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Картинка в описании бота («Что умеет этот бот?») — @BotFather → /setdescription → картинка (640×360). -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2B2F3A" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.75" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#07080B" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#07080B"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#636CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#636CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FF9D"/>
      <stop offset="1" stop-color="#00D46B"/>
    </linearGradient>
    <linearGradient id="sec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A55E2"/>
      <stop offset="1" stop-color="#636CFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2028"/>
      <stop offset="1" stop-color="#1A1C23"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="#07080B"/>
  <rect width="640" height="360" fill="url(#grid)" opacity="0.8"/>
  <rect width="640" height="360" fill="url(#fade)"/>
  <circle cx="528" cy="200" r="160" fill="url(#glow)"/>

  <!-- бренд в углу -->
  <g data-logo3d transform="translate(19 16) scale(0.0714)"/>
  <text x="94" y="58" font-family="Segoe UI" font-weight="700" font-size="17" fill="#FFFFFF">ТвойПодбор</text>

  <text x="40" y="112" font-family="Segoe UI" font-weight="700" font-size="27" fill="#FFFFFF" letter-spacing="-0.3">Работа — без лишних вкладок</text>

  <!-- три функции -->
  <g font-family="Segoe UI">
    <g transform="translate(40 146)">
      <text x="0" y="17" font-family="Consolas" font-weight="700" font-size="15" fill="#8F96FF">01</text>
      <text x="34" y="17" font-size="16" font-weight="600" fill="#FFFFFF">Поиск вакансий hh.ru</text>
      <text x="34" y="38" font-size="13" fill="#A0A0A0">город, зарплата, опыт, удалёнка</text>
    </g>
    <g transform="translate(40 206)">
      <text x="0" y="17" font-family="Consolas" font-weight="700" font-size="15" fill="#8F96FF">02</text>
      <text x="34" y="17" font-size="16" font-weight="600" fill="#FFFFFF">Отклик под вакансию в один тап</text>
      <text x="34" y="38" font-size="13" fill="#A0A0A0">из вашего резюме и требований</text>
    </g>
    <g transform="translate(40 266)">
      <text x="0" y="17" font-family="Consolas" font-weight="700" font-size="15" fill="#8F96FF">03</text>
      <text x="34" y="17" font-size="16" font-weight="600" fill="#FFFFFF">Избранное и статистика</text>
      <text x="34" y="38" font-size="13" fill="#A0A0A0">напоминания приходят в этот чат</text>
    </g>
  </g>

  <!-- индикатор лимита -->
  <g transform="translate(528 200)">
    <circle r="80" fill="url(#card)" stroke="#2B2F3A"/>
    <circle r="67" fill="none" stroke="url(#sec)" stroke-width="7"/>
    <text y="14" text-anchor="middle" font-family="Consolas" font-weight="700" font-size="50" fill="#FFFFFF">5</text>
    <text y="40" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#A0A0A0">запросов в день</text>
  </g>
  <rect x="464" y="298" width="128" height="30" rx="15" fill="url(#g)"/>
  <text x="528" y="318" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="13" fill="#07080B">бесплатно</text>
</svg>
