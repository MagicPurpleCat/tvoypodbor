# Прод-стек на одном VPS: Caddy (HTTPS) → api / webapp, Postgres, Redis.
# Запуск: docker compose up -d   (миграции: docker compose run --rm migrate)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tvoypodbor
      POSTGRES_USER: tvoypodbor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvoypodbor"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:-tvoypodbor-api}
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgres://tvoypodbor:${POSTGRES_PASSWORD}@postgres:5432/tvoypodbor
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/migrate.js"]
    depends_on: { postgres: { condition: service_healthy } }
    profiles: [tools]

  api:
    image: ${API_IMAGE:-tvoypodbor-api}
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: *dbenv
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  webapp:
    image: ${WEBAPP_IMAGE:-tvoypodbor-webapp}
    build:
      context: .
      dockerfile: webapp/Dockerfile
      args: { VITE_API_URL: "${PUBLIC_URL}" }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api, webapp]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
